{% extends "base.html" %}

{% block content %}
<div class="section" style="padding-top:32px">
  <div class="uye-box">
    <div class="uye-logo">SenaDizi</div>
    <h1 class="uye-baslik">Aramıza Katıl</h1>
    <p class="uye-alt">Ücretsiz hesap oluştur ve dizileri keşfet</p>

    <form method="post" action="/api/auth/register">
      <input type="hidden" name="next" value="{{ next_url or '/' }}">
      
      <div class="fg">
        <label>Kullanıcı Adı</label>
        <input class="fc" type="text" name="username" required minlength="3" maxlength="25" placeholder="kullaniciadi">
      </div>

      <div class="fg">
        <label>E-Posta Adresi</label>
        <input class="fc" type="email" name="email" required placeholder="ornek@mail.com">
      </div>
      
      <div class="fg">
        <label>Şifre</label>
        <input class="fc" type="password" name="password" required minlength="6" placeholder="••••••••">
      </div>

      <button class="btn btn-red btn-full" type="submit">Hesap Oluştur</button>
    </form>

    <div class="uye-gecis">
      Zaten bir hesabın var mı? <a href="/giris?next={{ next_url or '/' }}">Giriş Yap</a>
    </div>
  </div>
</div>
{% endblock %}

version: '3.8'

services:
  # PostgreSQL Veritabanı
  db:
    image: postgres:16-alpine
    container_name: senadizinet_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senadizi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretDBPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-senadizinet_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - senadizi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senadizi_user -d senadizinet_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SenaDizi Web Uygulaması
  web:
    build: .
    container_name: senadizinet_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_NAME=SenaDizi
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-senadizi-prod-ultra-secure-key-change-me-2026}
      - DATABASE_URL=postgresql://senadizi_user:${POSTGRES_PASSWORD:-SuperSecretDBPass2026!}@db:5432/senadizinet_prod
      - DOMAIN=${DOMAIN:-senadizinet.com}
      - BASE_URL=https://${DOMAIN:-senadizinet.com}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@senadizinet.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-SenaDizi2026!}
    volumes:
      - ./static:/app/static
    networks:
      - senadizi_network
    expose:
      - "8000"

  # Nginx Reverse Proxy (SSL & Yüksek Performans)
  nginx:
    image: nginx:alpine
    container_name: senadizinet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - senadizi_network

volumes:
  postgres_data:

networks:
  senadizi_network:
    driver: bridge
